# Nginx Production Reverse Proxy & Rate Limiting Configuration
# Project: cpetak-timetable
# Target Architecture: Nginx (TLS 1.3 Termination, Rate Limiting, Header Sanitization) -> Next.js (127.0.0.1:3000)

# -----------------------------------------------------------------------------
# Rate Limiting Zones (Defined in http block)
# -----------------------------------------------------------------------------
# Rate limit for general traffic (30 requests/second per IP)
limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;

# Rate limit for sensitive authentication endpoints (Teacher/Admin Login, Password Reset, Enrollment)
# Limits each client IP to 5 requests per minute with a burst allowance of 5.
limit_req_zone $binary_remote_addr zone=auth_strict_zone:10m rate=5r/m;

# Upstream Next.js Node.js Cluster / Process
upstream nextjs_upstream {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP Server Block: Redirect all HTTP to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name timetable.cpetak.ac.th;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS Server Block: Production Reverse Proxy with Hardened Security
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timetable.cpetak.ac.th;

    # TLS Certificates (managed via Certbot or Custom CA)
    ssl_certificate /etc/letsencrypt/live/timetable.cpetak.ac.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/timetable.cpetak.ac.th/privkey.pem;

    # TLS Protocols and Ciphers (Modern Profile, TLS 1.2 and TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum client payload size (for excel upload or timetable records)
    client_max_body_size 10M;

    # Rate limiting error status code
    limit_req_status 429;

    # -------------------------------------------------------------------------
    # Strict Rate Limiting on Authentication & Account Management Endpoints
    # -------------------------------------------------------------------------
    location ~* ^/api/auth/callback/credentials {
        limit_req zone=auth_strict_zone burst=5 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* ^/api/teacher/(enrollment|reset-password)/ {
        limit_req zone=auth_strict_zone burst=5 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # Static Assets & Next.js Bundles (Cached aggressively)
    # -------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # -------------------------------------------------------------------------
    # General Application Traffic & API Endpoints
    # -------------------------------------------------------------------------
    location / {
        limit_req zone=general_zone burst=20 nodelay;
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
